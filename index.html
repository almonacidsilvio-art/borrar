<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mi Primer AR.js - Laboratorio</title>
    <!-- Incluimos A-Frame para manejar los gráficos 3D -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <!-- Incluimos AR.js para el reconocimiento de marcadores y la cámara -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/a-frame/build/a-frame-ar.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
      
      <!-- Definimos qué aparecerá sobre el marcador -->
      <a-marker preset="hiro">
        <!-- Un cubo cian brillante simulando una pieza básica -->
        <a-box position="0 0.5 0" material="opacity: 0.85; color: #00bcd4;" rotation="0 45 0"></a-box>
        <!-- Un texto flotante sobre la figura -->
        <a-text value="Laboratorio UNPSJB" position="0 1.2 0" align="center" color="#ffffff"></a-text>
      </a-marker>

      <!-- Cámara de seguimiento -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
